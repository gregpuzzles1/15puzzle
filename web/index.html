<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SEEGJ7WBYQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-SEEGJ7WBYQ');
  </script>

  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <title>15 Puzzle Game – Free Sliding Tile Puzzle Online</title>

    <meta name="description"
      content="Play the classic 15 Puzzle sliding tile game online for free. Shuffle and solve the 4x4 number puzzle directly in your browser. Built with Flutter Web." />

    <meta name="keywords"
      content="15 puzzle, sliding puzzle, number puzzle, tile puzzle, classic puzzle game, 15 puzzle online" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="puzzle_15">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading spinner styles */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: white;
      z-index: 9999;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e0e0e0;
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .error-message {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .error-message h1 {
      color: #d32f2f;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .error-message p {
      color: #666;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- Loading spinner -->
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <!-- No JavaScript fallback -->
  <noscript>
    <div class="error-message">
      <h1>JavaScript Required</h1>
      <p>This game requires JavaScript to run. Please enable JavaScript in your browser settings and reload the page.</p>
    </div>
  </noscript>

  <!-- Browser compatibility check -->
  <script>
    // Check for modern browser features
    if (typeof Promise === 'undefined' || 
        typeof fetch === 'undefined' || 
        typeof Symbol === 'undefined') {
      // Unsupported browser
      document.body.innerHTML = `
        <div class="error-message">
          <h1>Unsupported Browser</h1>
          <p>This game requires a modern web browser. Please update your browser or use Chrome, Firefox, Safari, or Edge (released within the last 2 years).</p>
        </div>
      `;
    }
  </script>


  <footer style="text-align:center; margin-top:32px; font-size:14px; color:#555;">
    <p>
      <span id="copyright">&copy; 2025-2026 Greg P. · MIT License</span><br>
      <span>Email: </span><a href="mailto:gregpuzzles1@gmail.com">gregpuzzles1@gmail.com</a><br>
      <a href="https://github.com/gregpuzzles1/15puzzle" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span> · </span>
      <a href="https://github.com/gregpuzzles1/15puzzle/issues" target="_blank" rel="noopener noreferrer">Open an Issue</a>
    </p>
  </footer>

  <script>
    (function () {
      var startYear = 2025;
      var currentYear = new Date().getFullYear();
      var yearText = currentYear <= startYear ? String(startYear) : (startYear + '-' + currentYear);
      var el = document.getElementById('copyright');
      if (el) el.textContent = '© ' + yearText + ' Greg P. · MIT License';
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
